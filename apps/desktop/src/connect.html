<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Domus</title>
    <!-- Botanical Material 3 / Expressive tokens from design-system/domus/MASTER.md and index.css -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #12140E;
        --panel: #1A1C16;
        --raised: #282B24;
        --border: #44483D;
        --border-strong: #8F9285;
        --fg: #E2E3D8;
        --muted: #C5C8BA;
        --subtle: #8F9285;
        --primary: #B1D18A;
        --on-primary: #1F3701;
        --primary-container: #354E16;
        --on-primary-container: #CDEDA3;
        --on: #B1D18A;
        --warn: #F59E0B;
        --danger: #FFB4AB;
      }
      :root[data-theme='light'] {
        color-scheme: light;
        --bg: #F9FAEF;
        --panel: #FFFFFF;
        --raised: #EEEFE3;
        --border: #C5C8BA;
        --border-strong: #75796C;
        --fg: #1A1C16;
        --muted: #44483D;
        --subtle: #75796C;
        --primary: #4C662B;
        --on-primary: #FFFFFF;
        --primary-container: #CDEDA3;
        --on-primary-container: #354E16;
        --on: #4C662B;
        --warn: #B45309;
        --danger: #BA1A1A;
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme='dark']) {
          color-scheme: light;
          --bg: #F9FAEF;
          --panel: #FFFFFF;
          --raised: #EEEFE3;
          --border: #C5C8BA;
          --border-strong: #75796C;
          --fg: #1A1C16;
          --muted: #44483D;
          --subtle: #75796C;
          --primary: #4C662B;
          --on-primary: #FFFFFF;
          --primary-container: #CDEDA3;
          --on-primary-container: #354E16;
          --on: #4C662B;
          --warn: #B45309;
          --danger: #BA1A1A;
        }
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #12140E;
        --panel: #1A1C16;
        --raised: #282B24;
        --border: #44483D;
        --border-strong: #8F9285;
        --fg: #E2E3D8;
        --muted: #C5C8BA;
        --subtle: #8F9285;
        --primary: #B1D18A;
        --on-primary: #1F3701;
        --primary-container: #354E16;
        --on-primary-container: #CDEDA3;
        --on: #B1D18A;
        --warn: #F59E0B;
        --danger: #FFB4AB;
      }

      * { box-sizing: border-box; }
      ::-webkit-scrollbar { width: 7px; height: 7px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 9999px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }
      ::-webkit-scrollbar-button { display: none; width: 0; height: 0; }

      header {
        position: fixed;
        inset: 0 0 auto 0;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-bottom: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: -0.01em;
        background: var(--bg);
        -webkit-app-region: drag;
        user-select: none;
        z-index: 100;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 56px 20px 24px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: 100%;
        max-width: 380px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .logo {
        width: 44px;
        height: 44px;
      }
      .logo svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--fg);
      }
      .subtitle {
        margin: -8px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .section-title {
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--raised);
        overflow: hidden;
      }
      li + li {
        border-top: 1px solid var(--border);
      }
      li button {
        display: flex;
        width: 100%;
        min-height: 44px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 12px;
        border: 0;
        background: none;
        color: var(--fg);
        font: inherit;
        font-weight: 500;
        text-align: left;
        cursor: pointer;
        transition: background 120ms ease;
      }
      li button:hover {
        background: rgba(177, 209, 138, 0.12);
      }
      li small {
        color: var(--muted);
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 2px 6px;
        border-radius: 4px;
      }
      .empty {
        padding: 12px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }

      .divider {
        height: 1px;
        background: var(--border);
        margin: 2px 0;
      }

      form {
        display: flex;
        gap: 8px;
      }
      input {
        flex: 1;
        min-width: 0;
        height: 38px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--raised);
        color: var(--fg);
        font: inherit;
        font-size: 13px;
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }
      input:focus {
        border-color: var(--primary);
        outline: none;
        box-shadow: 0 0 0 2px rgba(177, 209, 138, 0.25);
      }
      .go {
        height: 38px;
        padding: 0 16px;
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: var(--on-primary);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 120ms ease;
        white-space: nowrap;
      }
      .go:hover {
        opacity: 0.9;
      }
      .go:active {
        opacity: 0.8;
      }

      .link-btn {
        border: 0;
        background: none;
        color: var(--primary);
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        padding: 0;
        transition: opacity 120ms ease;
      }
      .link-btn:hover {
        text-decoration: underline;
      }

      .cancel-link {
        border: 0;
        background: none;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        padding: 0;
        text-decoration: underline;
        text-underline-offset: 3px;
        transition: color 120ms ease;
      }
      .cancel-link:hover {
        color: var(--fg);
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #error {
        margin: 0;
        color: var(--danger);
        font-size: 12px;
        min-height: 18px;
      }
      #cancel-box {
        text-align: center;
        padding-top: 4px;
      }
    </style>
  </head>
  <body>
    <header>Domus</header>
    <main>
      <div class="logo">
        <svg viewBox="0 0 256 256" aria-hidden="true">
          <rect width="256" height="256" rx="56" fill="var(--panel)" stroke="var(--border)" stroke-width="8" />
          <g transform="translate(134 128) scale(.6) translate(-128 -128)">
            <path fill="var(--fg)" d="M36 52a12 12 0 0 1 12-12H116V120H36ZM132 40a88 88 0 0 1 0 176Z" />
            <path fill="var(--primary)" d="M36 136H116V216H48a12 12 0 0 1-12-12Z" />
          </g>
          <g id="dev-badge" style="display: none;">
            <rect x="154" y="24" width="78" height="32" rx="8" fill="#f59e0b" />
            <text x="193" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="1.5" fill="#12140E" text-anchor="middle" dominant-baseline="middle">DEV</text>
          </g>
        </svg>
      </div>
      <h1 id="title">Connect to your home</h1>
      <p class="subtitle" id="subtitle">Choose the Domus server this app should open.</p>

      <section class="card">
        <div class="section-header">
          <label class="section-title" id="found-title">On this network</label>
          <button class="link-btn" id="rescan" type="button">Search again</button>
        </div>
        <ul id="found" aria-labelledby="found-title" aria-live="polite">
          <li class="empty"><p id="searching">Searching…</p></li>
        </ul>

        <div class="divider"></div>

        <label class="section-title" id="address-label" for="address">Server address</label>
        <form id="form">
          <input id="address" placeholder="192.168.1.10:8443 or home.example.com" autocomplete="off" spellcheck="false" required />
          <button class="go" id="go" type="submit">Connect</button>
        </form>
        <p id="error" role="alert"></p>
      </section>

      <div id="cancel-box" style="display: none;">
        <button class="cancel-link" id="cancel" type="button">Cancel and return to current server</button>
      </div>
    </main>
    <script>
      const $ = (id) => document.getElementById(id)
      const messages = window.domus?.getMessages?.() ?? {}
      const t = (key, fallback) => messages[key] ?? fallback
      $('title').textContent = t('connect.title', 'Connect to your home')
      $('subtitle').textContent = t('connect.subtitle', 'Choose the Domus server this app should open.')
      $('found-title').textContent = t('connect.onNetwork', 'On this network')
      $('rescan').textContent = t('connect.rescan', 'Search again')
      $('searching').textContent = t('connect.searching', 'Searching…')
      $('address-label').textContent = t('connect.address', 'Server address')
      $('address').placeholder = t('connect.addressPlaceholder', '192.168.1.10:8443 or home.example.com')
      $('go').textContent = t('connect.connect', 'Connect')
      $('cancel').textContent = t('connect.cancel', 'Cancel and return to current server')

      const params = new URLSearchParams(location.search)
      const isDev = params.get('flavor') === 'dev' || window.domus?.flavor === 'dev'

      if (isDev) {
        document.title = 'Domus (Dev)'
        const header = document.querySelector('header')
        if (header) header.textContent = 'Domus (Dev)'
        const badge = $('dev-badge')
        if (badge) badge.style.display = 'block'
      }

      const activeTheme = params.get('theme') || window.domus?.getTheme?.()
      if (activeTheme === 'light') document.documentElement.setAttribute('data-theme', 'light')
      else if (activeTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark')

      $('error').textContent = params.get('message') ?? ''

      if (window.domus?.hasSavedServer?.()) {
        const cancelBox = $('cancel-box')
        if (cancelBox) cancelBox.style.display = 'block'
        const cancelBtn = $('cancel')
        if (cancelBtn) cancelBtn.onclick = () => window.domus.cancel()
      }

      async function connect(address) {
        const buttons = document.querySelectorAll('button')
        buttons.forEach((b) => (b.disabled = true))
        $('error').textContent = ''
        // On success the window navigates to the server and this page goes away.
        $('error').textContent = await window.domus.connect(address)
        buttons.forEach((b) => (b.disabled = false))
      }

      function setEmpty(text) {
        const li = document.createElement('li')
        li.className = 'empty'
        const p = document.createElement('p')
        p.textContent = text
        li.append(p)
        $('found').replaceChildren(li)
      }

      async function scan() {
        setEmpty(t('connect.searching', 'Searching…'))
        const servers = await window.domus.discover()
        $('found').replaceChildren(
          ...servers.map(({ name, url }) => {
            const item = document.createElement('li')
            const button = document.createElement('button')
            const host = document.createElement('small')
            button.type = 'button'
            button.textContent = name
            host.textContent = new URL(url).host
            button.append(host)
            button.onclick = () => connect(url)
            item.append(button)
            return item
          }),
        )
        if (servers.length === 0) setEmpty(t('connect.noneFound', 'No server found. Enter its address below.'))
      }

      $('rescan').onclick = scan
      $('form').onsubmit = (event) => {
        event.preventDefault()
        connect($('address').value)
      }
      scan()
    </script>
  </body>
</html>
