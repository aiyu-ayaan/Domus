[package]
name = "domus-backend"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "domus-backend"
path = "src/main.rs"

[dependencies]
home-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }
config = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
rumqttc = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
axum-server = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
aes-gcm = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
md-5 = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
rc4 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
chrono-tz = "0.10.4"
# Matter bridge (modules/matter): pure-Rust crypto, no OpenSSL. rs-matter runs on its own executor in a thread.
rs-matter = { version = "=0.4.1", features = ["async-io", "groups"] }
embassy-futures = "0.1"
embassy-time = { version = "0.5", features = ["std"] }
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }
async-io = "2"
async-channel = "2"
futures-lite = "2"
socket2 = "0.6"
if-addrs = "0.15"
rand-matter = { package = "rand", version = "0.10", features = ["std", "std_rng", "thread_rng"] }

[dev-dependencies]
# tests/matter_bridge.rs: a controller pairs with the bridge
heapless = "0.9"
env_logger = "0.11"
